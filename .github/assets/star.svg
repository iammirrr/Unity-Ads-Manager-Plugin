<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" role="img" aria-label="Star this repo">
<title>Star this repo</title>
<defs>
<style>@font-face{font-family:'LG';src:url(data:font/woff2;base64,) format('woff2');}
.lg{font-family:'LG','Luckiest Guy','Arial Black',Impact,sans-serif}
.ui{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,'Cascadia Code',Consolas,'SF Mono',Menlo,monospace}
.out{paint-order:stroke fill;stroke:#2A0B3A;stroke-linejoin:round}
.fb{transform-box:fill-box;transform-origin:center}

.press{animation:press 4s infinite}
@keyframes press{0%,70%{transform:translateY(0)}73%,77%{transform:translateY(9px)}81%,100%{transform:translateY(0)}}
.spin{animation:spin 4s infinite cubic-bezier(.3,1.5,.5,1)}
@keyframes spin{0%,74%{transform:rotate(0) scale(1)}86%{transform:rotate(72deg) scale(1.25)}94%,100%{transform:rotate(72deg) scale(1)}}
.sp{opacity:0;animation:sp 4s infinite ease-out}
@keyframes sp{0%,74%{opacity:0;transform:scale(.2)}80%{opacity:1;transform:scale(1.1)}92%,100%{opacity:0;transform:scale(.4)}}
.cursor{animation:cursor 4s infinite cubic-bezier(.4,0,.2,1)}
@keyframes cursor{0%,40%{transform:translate(70px,40px);opacity:0}48%{opacity:1}68%{transform:translate(0,0)}73%,77%{transform:translate(0,0) scale(.9)}82%{transform:translate(0,0) scale(1);opacity:1}96%,100%{transform:translate(70px,40px);opacity:0}}
.glow{animation:glow 4s infinite}
@keyframes glow{0%,72%{opacity:0;transform:scale(.9)}76%{opacity:.55}96%,100%{opacity:0;transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.dot{display:none}}@media (prefers-reduced-motion:reduce){.cursor{display:none}}</style>

<radialGradient id="sky" cx="0.5" cy="0.5" r="0.75">
  <stop offset="0" stop-color="#3BE3FF"/><stop offset="0.55" stop-color="#12C2F2"/><stop offset="1" stop-color="#0A78C2"/>
</radialGradient>
<linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FFF68A"/><stop offset="0.5" stop-color="#FFCF45"/><stop offset="1" stop-color="#F2900F"/>
</linearGradient>

</defs>
<g transform="translate(380.0 108)"><rect class="glow fb" x="-278.0" y="-66" width="556" height="132" rx="48" fill="none" stroke="#FFC21A" stroke-width="8" opacity="0"/></g>
<rect x="120" y="62" width="520" height="100" rx="34" fill="#B34D06" stroke="#2A0B3A" stroke-width="6"/>
<g class="press">
<rect x="120" y="50" width="520" height="100" rx="34" fill="url(#btn)" stroke="#2A0B3A" stroke-width="6"/>
