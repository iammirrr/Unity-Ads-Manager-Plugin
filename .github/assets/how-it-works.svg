</linearGradient>

<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff" opacity=".09"/></pattern>
<clipPath id="pscreen"><rect x="972" y="68" width="136" height="276" rx="18"/></clipPath>

