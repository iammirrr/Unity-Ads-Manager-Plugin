<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="How it works: your code calls AdsManager.Instance.rewardedAds.ShowRewardedAd(), the prefab asks Unity Ads to show the ad, and the completion callback comes back to RewardedAds so you can give the reward">
<title>How it works: your code calls AdsManager.Instance.rewardedAds.ShowRewardedAd(), the prefab asks Unity Ads to show the ad, and the completion callback comes back to RewardedAds so you can give the reward</title>
<defs>
<style>@font-face{font-family:'LG';src:url(data:font/woff2;base64,) format('woff2');}
.lg{font-family:'LG','Luckiest Guy','Arial Black',Impact,sans-serif}
.ui{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,'Cascadia Code',Consolas,'SF Mono',Menlo,monospace}
.out{paint-order:stroke fill;stroke:#2A0B3A;stroke-linejoin:round}
.fb{transform-box:fill-box;transform-origin:center}

.codehl{opacity:0;animation:codehl 7s infinite}
@keyframes codehl{0%,3%{opacity:0}6%,22%{opacity:1}27%,100%{opacity:0}}
.rowgo{opacity:0;animation:rowgo 7s infinite}
@keyframes rowgo{0%,24%{opacity:0}26%,44%{opacity:1}49%,100%{opacity:0}}
.rowok{opacity:0;animation:rowok 7s infinite}
@keyframes rowok{0%,88%{opacity:0}90%,97%{opacity:1}100%{opacity:0}}
.sticker{opacity:0;animation:sticker 7s infinite cubic-bezier(.3,1.6,.5,1)}
@keyframes sticker{0%,88%{opacity:0;transform:scale(.3) rotate(-20deg)}91%,97%{opacity:1;transform:scale(1) rotate(-8deg)}100%{opacity:0;transform:scale(1) rotate(-8deg)}}
.prew{opacity:0;animation:prew 7s infinite}
@keyframes prew{0%,46%{opacity:0}49%,74%{opacity:1}77%,100%{opacity:0}}
.pbar{transform-box:fill-box;transform-origin:0 50%;animation:pbar 7s infinite linear}
@keyframes pbar{0%,50%{transform:scaleX(0)}72%,100%{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.dot{display:none}}</style>

<radialGradient id="sky" cx="0.5" cy="0.5" r="0.75">
  <stop offset="0" stop-color="#3BE3FF"/><stop offset="0.55" stop-color="#12C2F2"/><stop offset="1" stop-color="#0A78C2"/>
</radialGradient>
<linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
