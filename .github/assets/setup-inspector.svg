<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Setup: the AdsManager prefab in the Unity Inspector. Paste your Android and iOS Game IDs into Initialize Ads, keep Is Testing on while developing, and leave the default ad unit IDs unless yours differ. The Console then shows Ads Initialized, Banner Ad Loaded and Interstitial Ad Loaded.">
<title>Setup: the AdsManager prefab in the Unity Inspector. Paste your Android and iOS Game IDs into Initialize Ads, keep Is Testing on while developing, and leave the default ad unit IDs unless yours differ. The Console then shows Ads Initialized, Banner Ad Loaded and Interstitial Ad Loaded.</title>
